<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤早見表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130f;
    --surface: #221c16;
    --surface-2: #2b241c;
    --line: #3a3226;
    --text: #f2e9da;
    --text-dim: #a89a86;
    --text-faint: #6e6255;
    --brass: #c99a3f;
    --brass-soft: rgba(201,154,63,0.16);
    --off: #574d3e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #241d16 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    padding-bottom: 40px;
  }
  .wrap{max-width: 560px; margin: 0 auto; padding: 0 16px;}

  header{
    padding: 28px 16px 18px;
    text-align:center;
  }
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing: 0.25em;
    color: var(--brass);
    text-transform: uppercase;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size: 26px;
    margin: 6px 0 2px;
    letter-spacing: 0.04em;
  }
  .sub{
    font-size:12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  /* region tabs */
  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding: 4px 16px 18px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-dim);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    transition: all .2s ease;
    white-space:nowrap;
  }
  .tab.active{
    background: var(--brass);
    border-color: var(--brass);
    color: #1b1610;
    font-weight:700;
  }

  /* week nav */
  .weeknav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 16px 14px;
  }
  .weeknav .range{
    font-family:'Space Mono', monospace;
    font-size:13px;
    color: var(--text-dim);
  }
  .weeknav button{
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    width:32px; height:32px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
  }
  .weeknav button:active{background: var(--surface-2);}

  /* table card */
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow:hidden;
    margin: 0 16px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
  }
  .table-scroll{
    overflow-x:auto;
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width: 320px;
  }
  thead th{
    position:sticky; top:0;
    background: var(--surface-2);
    font-weight:500;
    font-size:11px;
    color: var(--text-dim);
    padding: 8px 2px;
    text-align:center;
    border-bottom: 1px solid var(--line);
  }
  thead th .dow{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:10px;
    color: var(--text-faint);
    margin-top:2px;
  }
  thead th.sat{ color: #6fa8dc; }
  thead th.sat .dow{ color: #6fa8dc; }
  thead th.sun{ color: #e06666; }
  thead th.sun .dow{ color: #e06666; }
  thead th.today{ color: var(--brass); }
  thead th.today .dow{ color: var(--brass); }

  th.name-col, td.name-cell{
    position:sticky; left:0;
    background: var(--surface);
    text-align:left;
    padding: 8px 6px;
    font-size:10px;
    font-weight:700;
    line-height:1.2;
    border-right: 1px solid var(--line);
    z-index:2;
    width: 92px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  thead th.name-col{ z-index:3; background: var(--surface-2); font-size:11px; }

  tbody tr{ border-bottom: 1px solid var(--line); }
  tbody tr:last-child{ border-bottom:none; }

  td{
    text-align:center;
    padding: 6px 1px;
    vertical-align:middle;
  }
  td.today-col{ background: rgba(201,154,63,0.05); }

  .cell{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
  }
  .cell.on{
    background: var(--brass-soft);
    border: 1.5px solid var(--brass);
  }
  .cell .mark{
    font-size:12px;
    font-weight:700;
    color: var(--brass);
    line-height:1;
  }
  .cell.off{
    border: 1.5px solid var(--line);
  }
  .cell.off .mark{ color: var(--text-faint); }

  footer{
    text-align:center;
    padding: 22px 16px 4px;
    font-size:11px;
    color: var(--text-faint);
    letter-spacing:0.04em;
  }

  /* filter bar */
  .filterbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 16px 14px;
    gap:10px;
  }
  .filterbtn{
    display:flex;
    align-items:center;
    gap:6px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    font-size:13px;
    font-weight:500;
    padding: 8px 14px;
    border-radius: 999px;
    cursor:pointer;
  }
  .filterbtn .star{ color: var(--brass); }
  .filter-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color: var(--text-dim);
  }
  .switch{
    position:relative;
    width:38px; height:22px;
    border-radius:999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    cursor:pointer;
    flex:0 0 auto;
  }
  .switch::after{
    content:'';
    position:absolute;
    top:2px; left:2px;
    width:16px; height:16px;
    border-radius:50%;
    background: var(--text-faint);
    transition: transform .15s ease, background .15s ease;
  }
  .switch.on{ background: var(--brass-soft); border-color: var(--brass); }
  .switch.on::after{ transform: translateX(16px); background: var(--brass); }

  .shop-row td{
    background: var(--surface-2);
    text-align:left;
    padding: 5px 10px;
    font-size:10.5px;
    font-weight:700;
    color: var(--brass);
    letter-spacing:0.03em;
    border-bottom: 1px solid var(--line);
    position:sticky; left:0;
  }
  .name-cell{ cursor:pointer; }
  .name-cell .star-mark{
    display:inline-block;
    /* ★の押せる範囲を見た目より広くする */
    padding: 8px 5px 8px 6px;
    margin: -8px 1px -8px -6px;
    color: var(--line);
    font-size:13px;
  }
  .name-cell .name-text.has-link{
    text-decoration: underline dotted;
    text-decoration-color: var(--text-faint);
    text-underline-offset: 2px;
  }
  .name-cell.fav .star-mark{ color: var(--brass); }

  /* 退店済の表示 */
  td.retired-cell{
    text-align:center;
    color: #e06666;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.2em;
  }

  /* modal */
  .modal-backdrop{
    position:fixed; inset:0;
    background: rgba(0,0,0,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    width:100%;
    max-width:560px;
    max-height:75vh;
    overflow-y:auto;
    padding: 18px 16px 28px;
  }
  .modal h2{
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    margin: 0 0 12px;
  }
  .modal-list{ display:flex; flex-direction:column; gap:2px; }
  .modal-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
    font-size:14px;
  }
  .modal-row .star-mark{ color: var(--line); font-size:16px; }
  .modal-row.fav .star-mark{ color: var(--brass); }
  .modal-row .area-tag{
    margin-left:auto;
    font-size:11px;
    color: var(--text-faint);
  }
  .modal-close{
    display:block;
    width:100%;
    margin-top:16px;
    padding: 11px;
    border-radius: 10px;
    border: none;
    background: var(--brass);
    color: #1b1610;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise .5s ease both; }
    @keyframes rise{
      from{ opacity:0; transform: translateY(10px); }
      to{ opacity:1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">SHIFT LOOKUP</div>
    <h1>出勤早見表</h1>
    <div class="sub" id="statusMsg">読み込み中…</div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="filterbar">
    <button class="filterbtn" id="openFilter"><span class="star">★</span>セラピストを選ぶ</button>
    <label class="filter-toggle">
      選択のみ表示
      <span class="switch" id="favToggle"></span>
    </label>
  </div>

  <div class="card">
    <div class="table-scroll">
      <table id="shiftTable"></table>
    </div>
  </div>

  <footer>データは毎日自動更新されます・★タップでお気に入り登録／名前タップで個人ページ</footer>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2>セラピストを選ぶ</h2>
    <div class="modal-list" id="modalList"></div>
    <button class="modal-close" id="modalClose">閉じる</button>
  </div>
</div>

<script>
// ---- 実データ読み込み ----
let regions = {};
let currentRegion = null;
const dows = ["日","月","火","水","木","金","土"];

// タブの表示順（ここに無い地域は、後ろにそのまま並ぶ）
const REGION_ORDER = ["東京", "多摩", "神奈川", "埼玉"];
function orderedRegionNames(){
  const names = Object.keys(regions);
  const rank = r => { const i = REGION_ORDER.indexOf(r); return i === -1 ? 999 : i; };
  return names.sort((a, b) => rank(a) - rank(b));
}

// ---- お気に入り管理（タブレット内に保存） ----
const FAV_KEY = 'shiftapp_favorites';
const FILTER_KEY = 'shiftapp_filter_on';

function loadFavorites(){
  try{
    return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
  }catch(e){ return new Set(); }
}
function saveFavorites(set){
  localStorage.setItem(FAV_KEY, JSON.stringify([...set]));
}
let favorites = loadFavorites();
let filterOn = localStorage.getItem(FILTER_KEY) === '1';

// ★の登録・解除（解除のときだけ確認ポップを出す）
// 戻り値: 実際に変更したら true、キャンセルしたら false
function toggleFavorite(key, name){
  if(favorites.has(key)){
    const label = name || (key.split('::')[1] || key);
    if(!confirm(`${label}をお気に入りから削除しますか？`)) return false;
    favorites.delete(key);
  }else{
    favorites.add(key);
  }
  saveFavorites(favorites);
  return true;
}

// ★登録した人の店舗名を覚えておく（今週のデータに出てこなくなっても表示を続けるため）
const FAV_META_KEY = 'shiftapp_fav_meta';
function loadFavMeta(){
  try{ return JSON.parse(localStorage.getItem(FAV_META_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveFavMeta(meta){
  localStorage.setItem(FAV_META_KEY, JSON.stringify(meta));
}
let favMeta = loadFavMeta();

// 以前の「名前だけ」で管理していた古い形式のデータが残っていると
// 同じ人が二重に表示されてしまうため、読み込み時に取り除く
// （正しいキーは必ず「店舗名::名前」の形＝"::"を含む）
// 店名が変わった店舗の★登録を、新しい店名に引き継ぐための対応表（旧店名 → 新店名）
const SHOP_RENAMES = {
  "ラビット空間": "ウサじょ学園",
};

(function migrateOldFavorites(){
  let changed = false;

  // 店名変更の引き継ぎ
  Object.entries(SHOP_RENAMES).forEach(([oldShop, newShop]) => {
    const prefix = oldShop + '::';
    [...favorites].forEach(key => {
      if(key.startsWith(prefix)){
        favorites.delete(key);
        favorites.add(newShop + '::' + key.slice(prefix.length));
        changed = true;
      }
    });
    Object.keys(favMeta).forEach(key => {
      if(key.startsWith(prefix)){
        const meta = favMeta[key];
        delete favMeta[key];
        favMeta[newShop + '::' + key.slice(prefix.length)] = { ...meta, shop: newShop };
        changed = true;
      }
    });
  });

  [...favorites].forEach(key => {
    if(!key.includes('::')){
      favorites.delete(key);
      changed = true;
    }
  });
  Object.keys(favMeta).forEach(key => {
    if(!key.includes('::')){
      delete favMeta[key];
      changed = true;
    }
  });
  if(changed){
    saveFavorites(favorites);
    saveFavMeta(favMeta);
  }
})();

function isSameDate(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function parseDateStr(s){
  // "2026-08-11" -> Date
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

function fmtRange(dates){
  const f = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${f(dates[0])} – ${f(dates[dates.length-1])}`;
}

// ---- 在籍一覧（退店チェック用） ----
let rosters = {};
const NON_NAME_RE = /[^ぁ-んァ-ヶー一-龠々〆\u3400-\u9fffA-Za-z0-9Ａ-Ｚａ-ｚ０-９]+/g;
function normName(s){
  return (s || '').replace(/[\s\u3000]+/g, '').replace(NON_NAME_RE, '|').replace(/^\|+|\|+$/g, '');
}
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function nameInRoster(name, text){
  const n = normName(name);
  if(!n) return true;
  const re = new RegExp(`(?<![ぁ-ん])${escapeRegExp(n)}(?![ぁ-んァ-ヶー一-龠々\u3400-\u9fff])`);
  return re.test(text);
}
// 退店済かどうか（在籍一覧を確認できた店舗で、名前が見つからない場合のみ true）
function isRetired(t){
  const r = rosters[t.shop];
  if(!r || !r.ok || !r.text) return false;
  return !nameInRoster(t.name, r.text);
}
// 在籍一覧ページのリンクから、その人の個人ページURLを探す
function rosterLink(shop, name){
  const r = rosters[shop];
  if(!r || !Array.isArray(r.links)) return '';
  let best = null;
  r.links.forEach(([text, href]) => {
    if(!text || !href) return;
    if(nameInRoster(name, '|' + text + '|')){
      if(!best || text.length < best.text.length) best = { text, href };
    }
  });
  return best ? best.href : '';
}
// 個人ページのURL（出勤表から取れたもの → ★登録時に覚えたもの → 在籍一覧から探したもの の順）
function profileUrl(t){
  return t.url || (favMeta[t.key] && favMeta[t.key].url) || rosterLink(t.shop, t.name) || '';
}
function openProfile(t){
  const url = profileUrl(t);
  if(url){
    window.open(url, '_blank', 'noopener');
  }else{
    alert(`${t.name}の個人ページが見つかりませんでした`);
  }
}

async function loadRosters(){
  try{
    const res = await fetch('rosters.json', { cache: 'no-store' });
    if(!res.ok) return;
    const json = await res.json();
    rosters = json.shops || {};
  }catch(e){
    rosters = {};
  }
}

async function loadData(){
  await loadRosters();
  const statusEl = document.getElementById('statusMsg');
  try{
    const res = await fetch('data.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('data.json not found');
    const json = await res.json();
    regions = json.regions || {};
    currentRegion = orderedRegionNames()[0] || null;
    if(statusEl){
      const updated = json.generated_at ? new Date(json.generated_at) : null;
      statusEl.textContent = updated
        ? `最終更新: ${updated.getMonth()+1}/${updated.getDate()} ${String(updated.getHours()).padStart(2,'0')}:${String(updated.getMinutes()).padStart(2,'0')}`
        : '';
    }
    render();
  }catch(e){
    if(statusEl) statusEl.textContent = 'データを読み込めませんでした（data.jsonが見つかりません）';
    console.error(e);
  }
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  orderedRegionNames().forEach(region=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (region===currentRegion ? ' active' : '');
    btn.textContent = region;
    btn.onclick = () => { currentRegion = region; render(); };
    tabsEl.appendChild(btn);
  });
}

function render(){
  renderTabs();
  const data = regions[currentRegion];
  const table = document.getElementById('shiftTable');
  table.innerHTML = '';

  if(!data || !data.dates || data.dates.length === 0){
    table.innerHTML = '<tr><td style="padding:20px;color:var(--text-dim)">この地域のデータがまだありません</td></tr>';
    return;
  }

  const dateObjs = data.dates.map(parseDateStr);
  const today = new Date();

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const nameTh = document.createElement('th');
  nameTh.className = 'name-col';
  nameTh.textContent = 'セラピスト';
  headRow.appendChild(nameTh);
  dateObjs.forEach(d=>{
    const th = document.createElement('th');
    if(d.getDay()===6) th.classList.add('sat');
    if(d.getDay()===0) th.classList.add('sun');
    if(isSameDate(d, today)) th.classList.add('today');
    th.innerHTML = `${d.getDate()}<span class="dow">${dows[d.getDay()]}</span>`;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  // 今週のデータに載っている★登録者の店舗情報（地域も含めて）を記憶しておく
  let metaChanged = false;
  data.therapists.forEach(t=>{
    if(favorites.has(t.key)){
      const prev = favMeta[t.key];
      const url = t.url || rosterLink(t.shop, t.name) || (prev && prev.url) || '';
      if(!prev || prev.shop !== t.shop || prev.area !== t.area || prev.region !== currentRegion || prev.name !== t.name || (prev.url || '') !== url){
        favMeta[t.key] = { name: t.name, shop: t.shop || '', area: t.area || '', region: currentRegion, url };
        metaChanged = true;
      }
    }
  });
  if(metaChanged) saveFavMeta(favMeta);

  let baseList = filterOn
    ? data.therapists.filter(t => favorites.has(t.key))
    : data.therapists;

  // ★登録済みだが今週のデータに載っていない人を、出勤なしの状態で補う
  // （同じ地域に登録されていた人だけを対象にする）
  if(filterOn){
    const presentKeys = new Set(data.therapists.map(t => t.key));
    favorites.forEach(key => {
      if(!presentKeys.has(key)){
        const meta = favMeta[key];
        if(!meta || meta.region !== currentRegion) return; // 別の地域の★は表示しない
        baseList = [...baseList, { key, name: meta.name || key, shop: meta.shop || '（今週の掲載なし）', area: meta.area || '', absentThisWeek: true }];
      }
    });
  }

  // 店舗名でグループ化されるよう並べ替え（同じ店舗が連続するように）
  const visibleTherapists = [...baseList].sort((a, b) => {
    const sa = a.shop || '';
    const sb = b.shop || '';
    return sa === sb ? 0 : sa.localeCompare(sb, 'ja');
  });
  let lastShop = null;

  if(visibleTherapists.length === 0){
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = data.dates.length + 1;
    td.style.cssText = 'padding:24px;color:var(--text-dim);text-align:center;';
    td.textContent = filterOn ? '選択されたセラピストがいません。「セラピストを選ぶ」から登録してください。' : '表示するデータがありません';
    tr.appendChild(td);
    tbody.appendChild(tr);
    table.appendChild(tbody);
    return;
  }

  visibleTherapists.forEach((t, i)=>{
    // 店舗が切り替わるタイミングで見出し行を挿入
    if(t.shop && t.shop !== lastShop){
      const shopTr = document.createElement('tr');
      shopTr.className = 'shop-row';
      const shopTd = document.createElement('td');
      shopTd.colSpan = data.dates.length + 1;
      shopTd.textContent = t.shop;
      shopTr.appendChild(shopTd);
      tbody.appendChild(shopTr);
      lastShop = t.shop;
    }

    const tr = document.createElement('tr');
    if(t.absentThisWeek) tr.style.opacity = '0.55';
    const nameTd = document.createElement('td');
    nameTd.className = 'name-cell' + (favorites.has(t.key) ? ' fav' : '');
    const linkClass = profileUrl(t) ? ' has-link' : '';
    nameTd.innerHTML = `<span class="star-mark">★</span><span class="name-text${linkClass}">${t.name}</span>`;
    // ★の部分をタップ → お気に入りの登録・解除／名前の部分をタップ → 個人ページを開く
    nameTd.querySelector('.star-mark').onclick = (e) => {
      e.stopPropagation();
      if(toggleFavorite(t.key, t.name)) render();
    };
    nameTd.onclick = () => openProfile(t);
    tr.appendChild(nameTd);

    // 退店済の人は、予定欄に赤字で「退店済」とだけ表示する
    if(t.absentThisWeek && isRetired(t)){
      tr.style.opacity = '1';
      nameTd.style.opacity = '0.55';
      const td = document.createElement('td');
      td.colSpan = data.dates.length;
      td.className = 'retired-cell';
      td.textContent = '退店済';
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    data.dates.forEach((dateStr, idx)=>{
      const d = dateObjs[idx];
      const td = document.createElement('td');
      if(isSameDate(d, today)) td.classList.add('today-col');
      const dayMap = data.schedule[dateStr] || {};
      const worked = !!dayMap[t.key];
      const cell = document.createElement('div');
      cell.className = 'cell ' + (worked ? 'on' : 'off');
      cell.innerHTML = `<span class="mark">${worked ? '○' : '−'}</span>`;
      td.appendChild(cell);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

// ---- フィルタートグル ----
const favToggleEl = document.getElementById('favToggle');
function syncToggleUI(){
  favToggleEl.classList.toggle('on', filterOn);
}
favToggleEl.onclick = () => {
  filterOn = !filterOn;
  localStorage.setItem(FILTER_KEY, filterOn ? '1' : '0');
  syncToggleUI();
  render();
};
syncToggleUI();

// ---- 選択モーダル ----
const modalBackdrop = document.getElementById('modalBackdrop');
const modalList = document.getElementById('modalList');

function openModal(){
  const data = regions[currentRegion];
  modalList.innerHTML = '';
  if(data && data.therapists){
    data.therapists.forEach(t=>{
      const row = document.createElement('div');
      row.className = 'modal-row' + (favorites.has(t.key) ? ' fav' : '');
      row.innerHTML = `<span class="star-mark">★</span><span>${t.name}</span><span class="area-tag">${t.shop || ''}</span>`;
      row.onclick = () => {
        if(toggleFavorite(t.key, t.name)){
          row.classList.toggle('fav', favorites.has(t.key));
        }
      };
      modalList.appendChild(row);
    });
  }
  modalBackdrop.classList.add('open');
}
function closeModal(){
  modalBackdrop.classList.remove('open');
  render();
}
document.getElementById('openFilter').onclick = openModal;
document.getElementById('modalClose').onclick = closeModal;
modalBackdrop.onclick = (e) => { if(e.target === modalBackdrop) closeModal(); };

loadData();
</script>
</body>
