name: 出勤データ更新

on:
  schedule:
    # 毎日 日本時間 9:00 に実行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: {}  # 手動実行ボタン用

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: エステの気分を取得
        run: python scrape_kibun.py

      - name: データをまとめる
        run: python merge_data.py

      - name: 変更をコミット
        run: |
          git config user.name "shift-bot"
          git config user.email "shift-bot@users.noreply.github.com"
          git add data/ docs/data.json
          git diff --staged --quiet && echo "変更なし" || git commit -m "出勤データ自動更新"
          git push
