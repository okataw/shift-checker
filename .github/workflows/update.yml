name: 出勤データ更新

on:
  schedule:
    # 毎日 日本時間 6:17 / 8:17 / 10:17 / 12:17 に実行（どれか1回でも動けば更新される）
    # GitHub側の予約実行は混雑で1～2時間遅れたり、飛ばされたりすることがあるため、
    # 朝から昼にかけて何回かに分けて予約している
    - cron: '17 21 * * *'
    - cron: '17 23 * * *'
    - cron: '17 1 * * *'
    - cron: '17 3 * * *'
  workflow_dispatch: {}  # 手動実行ボタン用

permissions:
  contents: write

# 同時に2つ動いて、書き込みがぶつからないようにする（後から来た方は前の方が終わるまで待つ）
concurrency:
  group: shift-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 万が一止まっても25分で強制終了する安全装置
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        env:
          DEBIAN_FRONTEND: noninteractive  # インストール中に確認待ちで止まらないようにする
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: エステの気分を取得
        run: python scrape_kibun.py

      - name: ウサじょ学園を取得
        run: python scrape_rabbitspace.py

      - name: アロマモアを取得
        run: python scrape_aromamore.py

      - name: トキョプラを取得
        run: python scrape_tokyopla.py

      - name: Tiggerを取得
        run: python scrape_tigger.py

      - name: アマテラス横浜を取得
        run: python scrape_amaterasu.py

      - name: グリーンアップルを取得
        continue-on-error: true  # 新しく追加した店舗のため、失敗しても他の店舗の更新は止めない
        run: python scrape_greenapple.py

      - name: LINDA SPAを取得
        run: python scrape_lindaspa.py

      - name: NEW+PLUSを取得
        run: python scrape_newplus.py

      - name: Offsuitを取得
        run: python scrape_offsuit.py

      - name: Queendomを取得
        run: python scrape_queendom.py

      - name: ささやきを取得
        continue-on-error: true  # 新しく追加した店舗のため、失敗しても他の店舗の更新は止めない
        run: python scrape_sasayaki.py

      - name: データをまとめる
        run: python merge_data.py

      - name: 在籍一覧を取得（退店チェック用）
        continue-on-error: true  # ここで失敗しても出勤データの更新は止めない
        timeout-minutes: 7
        run: python scrape_rosters.py

      - name: 変更をコミット
        run: |
          git config user.name "shift-bot"
          git config user.email "shift-bot@users.noreply.github.com"
          git add data/ docs/data.json
          if [ -f docs/rosters.json ]; then git add docs/rosters.json; fi
          git diff --staged --quiet && echo "変更なし" && exit 0
          git commit -m "出勤データ自動更新"
          # 実行中にファイルが編集されていても失敗しないよう、最新の状態を取り込んでから送る
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
