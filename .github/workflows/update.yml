name: 出勤データ更新

on:
  schedule:
    # 毎日 日本時間 9:17 / 12:17 / 15:17 に実行（いずれか1回でも発火すれば更新される）
    # GitHub側の予約実行は混雑等で飛ぶことがあるため、時間を分けて成功率を上げている
    - cron: '17 0 * * *'
    - cron: '17 3 * * *'
    - cron: '17 6 * * *'
  workflow_dispatch: {}  # 手動実行ボタン用

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 万が一止まっても20分で強制終了する安全装置
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        env:
          DEBIAN_FRONTEND: noninteractive  # インストール中に確認待ちで止まらないようにする
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: エステの気分を取得
        run: python scrape_kibun.py

      - name: ラビット空間を取得
        run: python scrape_rabbitspace.py

      - name: アロマモアを取得
        run: python scrape_aromamore.py

      - name: トキョプラを取得
        run: python scrape_tokyopla.py

      - name: Tiggerを取得
        run: python scrape_tigger.py

      - name: アマテラス横浜を取得
        run: python scrape_amaterasu.py

      - name: LINDA SPAを取得
        run: python scrape_lindaspa.py

      - name: NEW+PLUSを取得
        run: python scrape_newplus.py

      - name: Offsuitを取得
        run: python scrape_offsuit.py

      - name: Queendomを取得
        run: python scrape_queendom.py

      - name: データをまとめる
        run: python merge_data.py

      - name: 在籍一覧を取得（退店チェック用）
        continue-on-error: true  # ここで失敗しても出勤データの更新は止めない
        timeout-minutes: 6
        run: python scrape_rosters.py

      - name: 変更をコミット
        run: |
          git config user.name "shift-bot"
          git config user.email "shift-bot@users.noreply.github.com"
          git add data/ docs/data.json
          if [ -f docs/rosters.json ]; then git add docs/rosters.json; fi
          git diff --staged --quiet && echo "変更なし" || git commit -m "出勤データ自動更新"
          git push
